<script>
(function () {
  'use strict';

  const ALL = (window.QUESTIONS || []).map(q => ({ ...q, letter: ['A','B','C','D','E'] }));

  /* ============================================================
     CSS — injected by JS (completely JS-rendered UI)
     ============================================================ */
  const CSS = `
:root{
  --bg:#0b1220; --bg2:#0f172e;
  --card:rgba(255,255,255,.05); --card2:rgba(255,255,255,.03);
  --bd:rgba(255,255,255,.09); --bd2:rgba(255,255,255,.15);
  --text:#e6eaf2; --muted:#93a0b4;
  --accent:#6366f1; --accent2:#8b5cf6;
  --green:#22c55e; --red:#ef4444; --yellow:#eab308;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
  color:var(--text); min-height:100vh;
  background:
    radial-gradient(900px 600px at 85% -10%, rgba(99,102,241,.18), transparent 60%),
    radial-gradient(800px 500px at -10% 110%, rgba(139,92,246,.14), transparent 60%),
    linear-gradient(180deg,var(--bg),var(--bg2));
  background-attachment:fixed;
}
button{font-family:inherit}
.topbar{
  position:sticky;top:0;z-index:10;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:14px 22px;
  background:rgba(11,18,32,.75);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--bd);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{
  width:38px;height:38px;border-radius:12px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:18px;
  box-shadow:0 6px 18px rgba(99,102,241,.35);
}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.wrap{max-width:1200px;margin:0 auto;padding:22px}
.hidden{display:none!important}

.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;backdrop-filter:blur(8px)}
.card h3{margin:0 0 12px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.btn{
  border:1px solid var(--bd2);border-radius:10px;padding:10px 16px;
  font-weight:600;font-size:14px;cursor:pointer;transition:.15s;
  color:var(--text);background:rgba(255,255,255,.07);
}
.btn:hover{background:rgba(255,255,255,.13)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(99,102,241,.35)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.warn{background:rgba(234,179,8,.92);border-color:transparent;color:#241a02}
.btn.danger{background:rgba(239,68,68,.92);border-color:transparent;color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* ---------- home ---------- */
.hero{text-align:center;padding:34px 12px 26px}
.hero h2{margin:0 0 8px;font-size:30px;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(90deg,#e6eaf2,#a5b4fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);font-size:15px}
.pill{display:inline-flex;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid var(--bd);color:var(--muted);font-size:12.5px}
.pill b{color:var(--text)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:12px;transition:transform .18s, background .18s;
  background:var(--card2)}
.mcard:hover{transform:translateY(-4px);background:var(--card)}
.mcard .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;
  background:rgba(99,102,241,.16);border:1px solid rgba(99,102,241,.35)}
.mcard h4{margin:0;font-size:16.5px}
.mcard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
.mcard .grow{flex:1}
.select,input[type=number]{
  width:100%;padding:10px 12px;border-radius:10px;font-size:14px;color:var(--text);
  background:rgba(255,255,255,.06);border:1px solid var(--bd2);outline:none;
}
.select:focus,input[type=number]:focus{border-color:var(--accent)}
.meta{color:var(--muted);font-size:12px}

/* ---------- quiz layout ---------- */
.quiz-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.badge{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:700;
  background:rgba(99,102,241,.18);border:1px solid rgba(99,102,241,.4);color:#c7d2fe}
.qcount{color:var(--muted);font-size:13px;font-weight:600}
.ptrack{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.pfill{height:100%;width:0%;border-radius:99px;transition:width .35s;
  background:linear-gradient(90deg,var(--accent),var(--accent2))}
.q-No{font-size:12px;font-weight:800;letter-spacing:.14em;color:#a5b4fc;text-transform:uppercase}
.q-text{margin:8px 0 18px;font-size:17.5px;line-height:1.6;font-weight:600;white-space:pre-wrap}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;padding:13px 15px;border-radius:12px;
  border:1px solid var(--bd2);background:rgba(255,255,255,.03);cursor:pointer;transition:.15s;
}
.opt:hover{background:rgba(255,255,255,.08);transform:translateX(3px)}
.opt.lock{cursor:default;transform:none}
.opt.lock:hover{background:rgba(255,255,255,.03)}
.okey{flex:0 0 auto;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-weight:800;font-size:13px;background:rgba(255,255,255,.08);border:1px solid var(--bd)}
.otext{line-height:1.55;font-size:14.5px}
.othead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tag{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.tag.good{background:rgba(34,197,94,.22);color:#86efac}
.tag.bad{background:rgba(239,68,68,.22);color:#fca5a5}
.opt.right{border-color:var(--green);background:rgba(34,197,94,.13)}
.opt.right .okey{background:var(--green);border-color:transparent;color:#052e16}
.opt.wrongp{border-color:var(--red);background:rgba(239,68,68,.13)}
.opt.wrongp .okey{background:var(--red);border-color:transparent;color:#450a0a}

.fb{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:700;font-size:14.5px}
.fb .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.fb.ok{background:rgba(34,197,94,.14);border:1px solid rgba(34,197,94,.45);color:#86efac}
.fb.ok .ic{background:var(--green);color:#052e16}
.fb.bad{background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.45);color:#fca5a5}
.fb.bad .ic{background:var(--red);color:#fff}
.fb small{font-weight:500;color:inherit;opacity:.85}

.explain{margin-top:10px;padding:13px 15px;border-radius:12px;line-height:1.62;font-size:14px;
  background:rgba(99,102,241,.12);border:1px solid rgba(99,102,241,.35);color:#c7d2fe}
.explain .lbl{display:block;margin-bottom:5px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#a5b4fc}

.q-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}

/* ---------- sidebar ---------- */
.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:86px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.09)}
.srow:last-child{border-bottom:none}
.srow span{color:var(--muted);font-size:13px}
.srow b{font-size:15px}
.srow.acc b{font-size:19px;color:#86efac}
.dot{display:inline-flex;width:11px;height:11px;border-radius:4px;margin-right:7px;vertical-align:-1px;border:1px solid rgba(255,255,255,.25)}
.dot.g{background:var(--green);border-color:transparent}
.dot.r{background:var(--red);border-color:transparent}
.dot.y{background:var(--yellow);border-color:transparent}
.dot.w{background:rgba(255,255,255,.85);border-color:rgba(255,255,255,.45)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;font-size:12.5px;color:var(--muted);margin:6px 0 12px}
.legend i{display:inline-flex;align-items:center;font-style:normal}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.chip{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:700;
  border:1px solid var(--bd2);background:rgba(255,255,255,.05);cursor:pointer;transition:.12s;color:var(--text)}
.chip:hover{transform:scale(1.08)}
.chip.g{background:var(--green);border-color:transparent;color:#052e16}
.chip.r{background:var(--red);border-color:transparent;color:#450a0a}
.chip.y{background:var(--yellow);border-color:transparent;color:#3b2a02}
.chip.cur{outline:2px solid var(--accent);outline-offset:2px}
.chip .m{position:relative}
.chip .m::after{content:'';position:absolute;top:-5px;right:-5px;width:8px;height:8px;border-radius:50%;
  background:var(--yellow);border:1.5px solid #3b2a02}
.qmark{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12.5px;margin-left:4px}

/* ---------- result ---------- */
.result{display:flex;flex-direction:column;align-items:center;gap:18px;padding:34px 18px}
.rtitle{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
.donut{position:relative;width:180px;height:180px;border-radius:50%;
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.donut .hole{position:absolute;inset:15px;border-radius:50%;background:#0d1526;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.donut .hole b{font-size:34px}
.donut .hole span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;width:100%;max-width:640px}
.rbox{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center}
.rbox span{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.rbox b{font-size:24px}
.atable{width:100%;max-width:640px;border-collapse:collapse;font-size:13.5px}
.atable th, .atable td{padding:8px 10px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08)}
.atable th{color:var(--muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.atable td:last-child, .atable th:last-child{text-align:right}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.rbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .28s ease}
@media(max-width:920px){
  .quiz-grid{grid-template-columns:1fr}
  .side{position:static}
  .brand small{display:none}
}
`;
  const style = document.createElement('style');
  style.textContent = CSS;
  document.head.appendChild(style);

  /* ============================================================
     Helpers
     ============================================================ */
  const root = document.getElementById('root');
  const LETTERS = ['A','B','C','D','E','F'];

  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : String(v));
    }
    for (const c of children.flat(Infinity)) {
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]];} return b; };

  /* ============================================================
     State
     ============================================================ */
  let qs = [], ans = [], done = [], marked = [], idx = 0, modeTitle = '';
  const ui = {};

  /* ============================================================
     Screens
     ============================================================ */
  function topbar(sub, showHome, onHome) {
    return h('header', { class:'topbar' },
      h('div', { class:'brand' },
        h('div', { class:'logo' }, '📺'),
        h('div', {},
          h('h1', { text:'Modern Display Technologies' }),
          h('small', { text: sub })
        )
      ),
      showHome ? h('button', { class:'btn sm', onclick:onHome }, '⟵ Home') : null
    );
  }

  function goHome() { clearState(); homeScreen(); }
  function clearState(){ qs=[]; ans=[]; done=[]; marked=[]; idx=0; }

  /* ---------- HOME ---------- */
  function homeScreen() {
    const byAssign = [...new Set(ALL.map(q => q.a))].sort((a,b)=>a-b);
    const sel = h('select', { class:'select' },
      byAssign.map(a =>
        h('option', { value:a }, `Assignment ${a}  —  ${ALL.filter(q=>q.a===a).length} questions`)
      )
    );
    const count = h('input', { type:'number', min:'5', max:String(ALL.length), value:'20' });

    const screen = h('div', {},
      topbar(`${ALL.length} questions · ${byAssign.length} assignments`, false),
      h('main', { class:'wrap' },
        h('section', { class:'hero anim' },
          h('h2', { text:'NPTEL Quiz Trainer' }),
          h('p', { text:'Practice assignment-wise, random, or the complete test — with instant answers & explanations.' }),
          h('div', { class:'pill' },
            h('b', { text:String(ALL.length) }), 'questions',
            h('span', { text:'·' }),
            h('b', { text:String(byAssign.length) }), 'assignments'
          )
        ),
        h('section', { class:'modes anim' },
          // assignment-wise
          h('div', { class:'card mcard' },
            h('div', { class:'ico' }, '📚'),
            h('h4', { text:'Assignment-wise Quiz' }),
            h('p', { text:'Pick one assignment and attempt its full question paper.' }),
            h('div', { class:'grow' }),
            sel,
            h('button', { class:'btn primary', onclick:()=>{
                const a = +sel.value;
                startQuiz(ALL.filter(q=>q.a===a).slice(), `Assignment ${a} Quiz`);
            } }, 'Start Quiz'),
            h('span', { class:'meta', text:'Practice mode · stats on the right' })
          ),
          // random
          h('div', { class:'card mcard' },
            h('div', { class:'ico' }, '🎲'),
            h('h4', { text:'Random Assignment Test' }),
            h('p', { text:'A shuffled mix of questions from every assignment.' }),
            h('div', { class:'grow' }),
            count,
            h('button', { class:'btn primary', onclick:()=>{
                const n = Math.max(1, Math.min(ALL.length, +count.value || 20));
                startQuiz(shuffle(ALL).slice(0, n), 'Random Test');
            } }, 'Start Test'),
            h('span', { class:'meta', text:'Timed pressure comes from you — stats live on the right' })
          ),
          // complete
          h('div', { class:'card mcard' },
            h('div', { class:'ico' }, '🏁'),
            h('h4', { text:'Complete Assignment Test' }),
            h('p', { text:'Every question, every assignment, in order. The full grind.' }),
            h('div', { class:'grow' }),
            h('button', { class:'btn primary', onclick:()=>startQuiz(ALL.slice(), 'Complete Test') }, 'Start Full Test'),
            h('span', { class:'meta', text:'Per-assignment breakdown at the end' })
          )
        )
      ),
      h('footer', { class:'wrap', style:'text-align:center;color:var(--muted);font-size:12px;padding-top:8px' },
        'Built from OCR of NPTEL solution PDFs · Modern Display Technologies: Flat Panel Displays (IIT Guwahati)'
      )
    );
    root.innerHTML = '';
    root.appendChild(screen);
  }

  /* ---------- QUIZ ---------- */
  function startQuiz(list, title) {
    qs = list; modeTitle = title; idx = 0;
    ans = new Array(qs.length).fill(null);
    done = new Array(qs.length).fill(false);
    marked = new Array(qs.length).fill(false);
    quizScreen();
  }

  function status(i) {
    if (done[i]) return ans[i] === qs[i].correct ? 'g' : 'r';
    if (marked[i]) return 'y';
    return '';
  }

  function quizScreen() {
    // sidebar (built once)
    ui.sTotal  = h('b', { text:'0' });
    ui.sAtt    = h('b', { text:'0' });
    ui.sOk     = h('b', { text:'0' });
    ui.sWrong  = h('b', { text:'0' });
    ui.sAcc    = h('b', { text:'0%' });
    ui.palette = h('div', { class:'palette' });
    ui.legG    = h('b', { text:'0' });
    ui.legR    = h('b', { text:'0' });
    ui.legY    = h('b', { text:'0' });
    ui.legW    = h('b', { text:'0' });

    const side = h('aside', { class:'side' },
      h('div', { class:'card' },
        h('h3', { text:'Stats' }),
        h('div', { class:'srow' }, h('span', {text:'Total questions'}), ui.sTotal),
        h('div', { class:'srow' }, h('span', {text:'Attempted'}), ui.sAtt),
        h('div', { class:'srow' }, h('span', {text:'Correct'}), ui.sOk),
        h('div', { class:'srow' }, h('span', {text:'Wrong'}), ui.sWrong),
        h('div', { class:'srow acc' }, h('span', {text:'Accuracy'}), ui.sAcc),
        h('div', { class:'srow' }, h('span', {text:'Marked for review'}), h('b',{text:'0', id:'mk'}))
      ),
      h('div', { class:'card' },
        h('h3', { text:'Questions' }),
        h('div', { class:'legend' },
          h('i', {}, h('span',{class:'dot g'}), 'Correct ', ui.legG),
          h('i', {}, h('span',{class:'dot r'}), 'Wrong ', ui.legR),
          h('i', {}, h('span',{class:'dot y'}), 'Review ', ui.legY),
          h('i', {}, h('span',{class:'dot w'}), 'Unattempted ', ui.legW)
        ),
        ui.palette,
        h('div', { class:'qmark', style:'margin-top:10px' },
          h('span', { text:'⚑ = also marked for review' })
        )
      )
    );

    // main
    ui.badge   = h('span', { class:'badge', text:modeTitle });
    ui.qcount  = h('span', { class:'qcount' });
    ui.pfill   = h('div', { class:'pfill' });
    ui.qNo     = h('div', { class:'q-No' });
    ui.qText   = h('div', { class:'q-text' });
    ui.opts    = h('div', { class:'opts' });
    ui.fb      = h('div', { class:'fb ok hidden' });
    ui.explain = h('div', { class:'explain hidden' });

    ui.bPrev  = h('button', { class:'btn',        onclick:()=>goto(idx-1) }, '← Prev');
    ui.bNext  = h('button', { class:'btn',        onclick:()=>goto(idx+1) }, 'Next →');
    ui.bSkip  = h('button', { class:'btn',        onclick:skip }, '⏭ Skip');
    ui.bMark  = h('button', { class:'btn warn',   onclick:toggleMark }, '⚑ Mark for review');
    ui.bFin   = h('button', { class:'btn danger', onclick:confirmFinish }, 'Finish');

    const main = h('section', { class:'card anim' },
      h('div', { class:'q-head' }, ui.badge, ui.qcount),
      h('div', { class:'ptrack' }, ui.pfill),
      ui.qNo, ui.qText, ui.opts, ui.fb, ui.explain,
      h('div', { class:'q-actions' }, ui.bPrev, ui.bSkip, ui.bNext, ui.bMark, ui.bFin)
    );

    const screen = h('div', {},
      topbar(modeTitle, true, ()=>{ if(confirm('Leave the quiz? Progress will be lost.')) goHome(); }),
      h('main', { class:'wrap' },
        h('div', { class:'quiz-grid' }, main, side)
      )
    );
    root.innerHTML = '';
    root.appendChild(screen);

    renderQ();
    updateSide();
  }

  function renderQ() {
    const q = qs[idx];
    ui.badge.textContent = modeTitle;
    ui.qcount.textContent = `Question ${idx+1} of ${qs.length}`;
    ui.pfill.style.width = `${Math.round(((idx+1)/qs.length)*100)}%`;
    ui.qNo.textContent = `Q${idx+1}`;
    ui.qText.textContent = q.q;

    // options
    ui.opts.innerHTML = '';
    const answered = done[idx];
    q.opts.forEach((t, i) => {
      const head = h('div', { class:'othead' }, h('span', { class:'otext', text:t }));
      const row = h('div', { class:'opt' + (answered ? ' lock' : ''),
        onclick: answered ? null : () => grade(i) },
        h('span', { class:'okey', text:LETTERS[i] }),
        head
      );
      if (answered) {
        if (i === q.correct) {
          row.classList.add('right');
          head.appendChild(h('span', { class:'tag good', text:ans[idx]===i ? '✓ your answer · correct' : 'correct answer' }));
        } else if (ans[idx] === i) {
          row.classList.add('wrongp');
          head.appendChild(h('span', { class:'tag bad', text:'✗ your answer' }));
        }
      }
      ui.opts.appendChild(row);
    });

    // feedback
    if (answered) {
      const ok = ans[idx] === q.correct;
      ui.fb.className = 'fb ' + (ok ? 'ok' : 'bad');
      ui.fb.innerHTML = '';
      ui.fb.appendChild(h('span', { class:'ic', text: ok ? '✓' : '✗' }));
      ui.fb.appendChild(h('span', { html: ok ? 'Correct! <small>+1</small>'
                                             : `Wrong! <small>correct answer is ${LETTERS[q.correct]}</small>` }));
      ui.fb.classList.remove('hidden');
      if (q.exp) {
        ui.explain.innerHTML = `<span class="lbl">Explanation</span>${esc(q.exp)}`;
        ui.explain.classList.remove('hidden');
      } else {
        ui.explain.classList.add('hidden');
      }
    } else {
      ui.fb.classList.add('hidden');
      ui.explain.classList.add('hidden');
    }

    ui.bMark.textContent = marked[idx] ? '⚑ Marked ✓' : '⚑ Mark for review';
    ui.bPrev.disabled = idx === 0;
    ui.bNext.disabled = idx === qs.length - 1;
    ui.bFin.textContent = idx === qs.length - 1 ? 'Finish & Results' : 'Finish';

    highlightPalette();
  }

  function grade(i) {
    if (done[idx]) return;
    ans[idx] = i;
    done[idx] = true;
    renderQ();
    updateSide();
  }

  function skip() {
    if (done[idx]) { goto(idx + 1); return; }
    let j = idx;
    for (let k = 0; k < qs.length; k++) {
      j = (j + 1) % qs.length;
      if (!done[j] && !marked[j]) break;
    }
    goto(j === idx ? Math.min(idx + 1, qs.length - 1) : j);
  }

  function toggleMark() {
    marked[idx] = !marked[idx];
    renderQ();
    updateSide();
  }

  function goto(i) {
    if (i < 0 || i >= qs.length) return;
    idx = i;
    renderQ();
  }

  function confirmFinish() {
    const left = done.filter(d => !d).length;
    if (left && !confirm(`${left} question(s) unanswered. Finish anyway?`)) return;
    finish();
  }

  /* ---------- live stats + palette ---------- */
  function updateSide() {
    let att = 0, ok = 0, wrong = 0, mk = 0, y = 0, w = 0;
    for (let i = 0; i < qs.length; i++) {
      if (done[i]) { att++; ans[i] === qs[i].correct ? ok++ : wrong++; }
      else { marked[i] ? y++ : w++; }
      if (marked[i]) mk++;
    }
    ui.sTotal.textContent = qs.length;
    ui.sAtt.textContent   = att;
    ui.sOk.textContent    = ok;
    ui.sWrong.textContent = wrong;
    ui.sAcc.textContent   = (att ? Math.round(ok / att * 100) : 0) + '%';
    const mkEl = document.getElementById('mk');
    if (mkEl) mkEl.textContent = mk;
    ui.legG.textContent = ok;
    ui.legR.textContent = wrong;
    ui.legY.textContent = y;
    ui.legW.textContent = w;

    ui.palette.innerHTML = '';
    for (let i = 0; i < qs.length; i++) {
      const cls = 'chip ' + status(i) + (i === idx ? ' cur' : '');
      const chip = h('button', { class:cls, title:`Q${i+1}`, onclick:()=>goto(i) },
        marked[i] && !done[i] ? '⚑' : (i + 1)
      );
      ui.palette.appendChild(chip);
    }
    highlightPalette();
  }

  function highlightPalette() {
    [...ui.palette.children].forEach((c, i) => c.classList.toggle('cur', i === idx));
  }

  /* ---------- RESULT ---------- */
  function finish() {
    let att = 0, ok = 0, wrong = 0;
    const per = Object.create(null);
    qs.forEach((q, i) => {
      const key = q.name || ('Assignment ' + q.a);
      if (!per[key]) per[key] = { n: 0, ok: 0 };
      const a = per[key];
      a.n++;
      if (done[i]) {
        att++;
        if (ans[i] === q.correct) { ok++; a.ok++; } else wrong++;
      }
    });
    const acc = att ? Math.round(ok / att * 100) : 0;

    const donut = h('div', { class:'donut',
      style:`background:conic-gradient(var(--green) ${acc}%, rgba(255,255,255,.09) ${acc}%)` },
      h('div', { class:'hole' }, h('b', { text:acc + '%' }), h('span', { text:'accuracy' }))
    );

    const rows = Object.entries(per).map(([name, s]) => {
      const p = Math.round(s.ok / s.n * 100);
      return h('tr', {},
        h('td', { text:name }),
        h('td', { text:`${s.ok}/${s.n}` }),
        h('td', {},
          h('span', { text:p + '%' }),
          h('div', { class:'bar' }, h('i', { style:`width:${p}%` }))
        )
      );
    });

    const screen = h('div', {},
      topbar('Results', true, goHome),
      h('main', { class:'wrap' },
        h('div', { class:'card result anim' },
          h('h2', { class:'rtitle', text:modeTitle + ' — Complete!' }),
          donut,
          h('div', { class:'rgrid' },
            h('div', { class:'rbox' }, h('span', {text:'Total'}),    h('b', {text:String(qs.length)})),
            h('div', { class:'rbox' }, h('span', {text:'Attempted'}),h('b', {text:String(att)})),
            h('div', { class:'rbox' }, h('span', {text:'Correct'}),  h('b', {text:String(ok), style:'color:#86efac'})),
            h('div', { class:'rbox' }, h('span', {text:'Wrong'}),    h('b', {text:String(wrong), style:'color:#fca5a5'})),
            h('div', { class:'rbox' }, h('span', {text:'Skipped'}),  h('b', {text:String(qs.length - att)}))
          ),
          rows.length > 1 ? h('table', { class:'atable' },
            h('thead', {}, h('tr', {}, h('th', {text:'Assignment'}), h('th', {text:'Score'}), h('th', {text:'Accuracy'}))),
            h('tbody', {}, rows)
          ) : null,
          h('div', { class:'rbtns' },
            h('button', { class:'btn primary', onclick:()=>{ clearState(); homeScreen(); } }, '🏠 Back to Home'),
            h('button', { class:'btn', onclick:()=>startQuiz(qs.slice(), modeTitle) }, '🔄 Retry Same Set')
          )
        )
      )
    );
    root.innerHTML = '';
    root.appendChild(screen);
  }

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (!qs.length) return;
    if (e.key >= '1' && e.key <= String(qs[idx].opts.length)) {
      if (!done[idx]) { grade(+e.key - 1); e.preventDefault(); }
    } else if (e.key === 'ArrowRight') { goto(idx + 1); }
    else if (e.key === 'ArrowLeft')  { goto(idx - 1); }
  });

  /* ---------- boot + never show a blank page ---------- */
  function paintError(msg) {
    document.body.style.cssText = 'font-family:sans-serif;background:#0b1220;color:#fff;margin:0;padding:24px';
    const box = document.getElementById('root') || document.body;
    if (box !== document.body) { box.innerHTML = ''; }
    const d = document.createElement('pre');
    d.style.cssText = 'white-space:pre-wrap;background:#3b1111;border:1px solid #ef4444;color:#fecaca;padding:16px;border-radius:12px;max-width:900px;margin:20px auto';
    d.textContent = 'Quiz app hit an error:\n\n' + msg;
    box.appendChild(d);
  }
  window.addEventListener('error', e => { if (!document.body.innerText.includes('error:')) paintError(e.message + '\n' + (e.error && e.error.stack || '')); });

  try {
    homeScreen();
  } catch (err) {
    paintError(err.message + '\n' + (err.stack || ''));
  }
})();
</script>
</body>
</html>
